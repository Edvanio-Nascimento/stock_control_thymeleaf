<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Home', ~{::content})}">

    <body class="bg-gray-900 text-gray-400">

        <div th:fragment="content" class="w-10/12 p-5">

            <div class="flex flex-col w-4xl mx-auto">
                <h2 class="text-2xl italic font-black text-sky-500 mb-5">
                    Category List
                </h2>

                <div class="flex justify-between border p-5 rounded-md">
                    <form th:action="@{/categories}" method="get" class="w-9/12">
                        <div class="flex">
                            <div class="flex flex-col mr-10 gap-3">
                                <label class="text-sm font-semibold">Inactive</label>
                                <!-- O valor enviado será 'false' se estiver marcado -->
                                <input type="checkbox" name="active" value="false"
                                       th:checked="${param.active != null && param.active[0] == 'false'}">
                            </div>


                            <input type="text" name="name" placeholder="Search for category by name...." autofocus
                            class="border py-2 px-4 rounded-l-md w-9/12 outline-none focus:border-sky-500"
                            >
                            <button type="submit"
                                class="border rounded-r-md py-2 px-4 bg-emerald-700  cursor-pointer hover:bg-emerald-500 transition-all duration-500
                                font-black italic text-white outline-none focus:border-sky-500"
                            >
                                <i class="bi bi-search font-black text-xl"></i>
                            </button>
                        </div>
                    </form>

                    <a th:href="@{/categories/new}"
                       class="border border-emerald-950 rounded-lg   py-2 px-4 bg-emerald-600 font-black text-white hover:bg-emerald-500 transition-all duration-500 outline-none
                       focus:border-emerald-500 flex items-center"
                    >
                        <i class="bi bi-plus text-2xl font-black"></i>
                        Add Category
                    </a>
                </div>

                <p th:if="${message}" th:text="${message}" class="mt-5 py-5 pl-3 font-bold italic bg-red-400 rounded-md text-white"></p>

                <div>
                    <table class="mt-10 w-full">
                        <thead class="text-left fpmt-bold italic">
                            <tr class=" bg-gray-950">
                                <th class="py-3 pl-2">#</th>
                                <th >Name</th>
                                <th >Active</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="category: ${categories}" class="border-b border-gray-500 hover:bg-gray-800 transition-all duration-1000">
                                <td th:text="${category.id}" class="pl-2 py-5 w-1/12"></td>
                                <td th:text="${category.name}" class="pl-2 py-5 w-5/12"></td>
                                <td th:text="${category.active}" class="pl-2 py-5 w-2/12"></td>
                                <td class="px-2 py-5 flex justify-between">
                                    <a th:href="@{categories/edit/{id}(id = ${category.id})}"
                                        class="border py-2 px-4 rounded-lg bg-orange-500 text-white font-black italic border-2 border-orange-900 hover:bg-orange-700
                                        flex items-center transition-all duration-1000 gap-1"
                                    >
                                        <i class="bi bi-pencil font-black text-lg"></i>
                                        Edit
                                    </a>

                                    <a th:href="@{categories/details/{id}(id = ${category.id})}"
                                       class="border py-2 px-4 rounded-lg bg-sky-500 text-white font-black italic border-2 border-sky-900 hover:bg-sky-700
                                       flex items-center transition-all duration-1000 gap-1"
                                    >
                                        <i class="bi bi-eye"></i>
                                        View
                                    </a>

                                    <a th:href="@{categories/delete/{id}(id = ${category.id})}"
                                       class="border py-2 px-4 rounded-lg bg-red-500 text-white font-black italic border-2 border-red-900 hover:bg-red-700
                                       flex items-center transition-all duration-1000 gap-1"
                                    >
                                        <i class="bi bi-trash"></i>
                                        Delete
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>


    </body>

</html>
